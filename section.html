<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Marcyrl — Cybersecurity Roadmap</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: 'Tajawal', 'Inter', sans-serif; background-color: #070b14; color: #e2e8f0; }
  .glass-panel { background: rgba(17, 24, 39, 0.78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  .glass-panel-hover:hover { border-color: rgba(6, 182, 212, 0.4); box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.15); }
  .nav-card:hover .nav-arrow { transform: translateX(-4px); }
  html[dir=ltr] .nav-card:hover .nav-arrow { transform: translateX(4px); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0b1120; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
  .inp { width: 100%; background: #0b1220; border: 1px solid #1f2b40; border-radius: .6rem; padding: .55rem .75rem; color: #e2e8f0; font-size: .875rem; outline: none; }
  .inp:focus { border-color: #06b6d4; box-shadow: 0 0 0 1px #06b6d4; }
  .btn-primary { display: inline-flex; align-items: center; gap: .45rem; background: linear-gradient(90deg,#0891b2,#2563eb); color: #fff; font-weight: 700; font-size: .85rem; padding: .55rem 1rem; border-radius: .65rem; }
  .btn-primary:hover { filter: brightness(1.1); } .btn-primary:disabled { opacity: .6; }
  .btn-ghost { display: inline-flex; align-items: center; gap: .45rem; background: rgba(30,41,59,.7); border: 1px solid #334155; color: #cbd5e1; font-weight: 700; font-size: .78rem; padding: .5rem .8rem; border-radius: .6rem; }
  .btn-ghost:hover { background: #334155; color: #fff; }
  .btn-accent { display: inline-flex; align-items: center; gap: .4rem; background: rgba(8,51,68,.6); border: 1px solid rgba(14,116,144,.5); color: #22d3ee; font-weight: 700; font-size: .78rem; padding: .5rem .8rem; border-radius: .6rem; }
  .menu-item { display: flex; width: 100%; align-items: center; gap: .6rem; padding: .55rem .7rem; border-radius: .5rem; font-size: .85rem; color: #e2e8f0; text-align: start; }
  .menu-item:hover { background: rgba(51,65,85,.6); }
  .ebtn { width: 1.9rem; height: 1.9rem; display: inline-flex; align-items: center; justify-content: center; gap: .3rem; border-radius: .45rem; background: rgba(30,41,59,.8); border: 1px solid #334155; color: #94a3b8; font-size: .72rem; font-weight: 700; }
  .ebtn:hover { color: #fff; border-color: #06b6d4; }
  .chip { font-size: .78rem; font-weight: 700; padding: .35rem .85rem; border-radius: 999px; background: rgba(17,24,39,.8); border: 1px solid #1f2b40; color: #cbd5e1; }
  .chip-on { border-color: #06b6d4; color: #22d3ee; background: rgba(6,182,212,.1); }
  .th { text-align: start; padding: .7rem .9rem; font-weight: 700; }
  .td { padding: .7rem .9rem; vertical-align: top; }
  @media print { .no-print, .edit-bar { display: none !important; } body { background: #fff; } .glass-panel { backdrop-filter: none; } }
</style>
</head>
<body data-page="section" class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">
<div id="app" class="min-h-screen flex flex-col"></div>
<noscript><p style="padding:2rem;text-align:center">JavaScript is required.</p></noscript>
<script src="app.js"></script>
</body>
</html>
